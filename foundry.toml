[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 200
via_ir = true
offline = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@chainlink/=node_modules/@chainlink/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "frost-secp256k1-evm/=lib/frost-secp256k1-evm/src/"
]
evm_version = "prague"
